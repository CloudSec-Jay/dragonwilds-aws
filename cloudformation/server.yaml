AWSTemplateFormatVersion: '2010-09-09'
Description: Nested infrastructure for the Dragonwilds dedicated server

Parameters:
  ProjectName:
    Type: String
    Default: dragonwilds
    MaxLength: 20
    AllowedPattern: ^[a-zA-Z0-9-]+$
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, test, production]
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.42.1.0/24
  AllowedGameCidr:
    Type: String
    Default: 0.0.0.0/0
  AmiId:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
    Default: t3a.large
  RootVolumeSize:
    Type: Number
    Default: 20
    MinValue: 10
  DataVolumeSize:
    Type: Number
    Default: 30
    MinValue: 10
  ServerSecretArn:
    Type: String
  WorldSaveBucket:
    Type: String
    Default: ''
    AllowedPattern: ^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
  WorldSaveKey:
    Type: String
    Default: ''
    AllowedPattern: ^$|^[A-Za-z0-9_%./()!*=-]+[.]sav$
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90]
  BackupRetentionDays:
    Type: Number
    Default: 14
    MinValue: 7
  AlarmEmail:
    Type: String
    Default: ''

Rules:
  WorldSaveParametersTogether:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref WorldSaveBucket, '']
            - !Equals [!Ref WorldSaveKey, '']
          - !And
            - !Not [!Equals [!Ref WorldSaveBucket, '']]
            - !Not [!Equals [!Ref WorldSaveKey, '']]
        AssertDescription: WorldSaveBucket and WorldSaveKey must both be set or both be empty

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested/network.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcCidr: !Ref VpcCidr
        PublicSubnetCidr: !Ref PublicSubnetCidr
        AllowedGameCidr: !Ref AllowedGameCidr
        LogRetentionDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  WorkloadStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested/workload.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        PublicSubnetId: !GetAtt NetworkStack.Outputs.PublicSubnetId
        PublicSubnetAvailabilityZone: !GetAtt NetworkStack.Outputs.PublicSubnetAvailabilityZone
        SecurityGroupId: !GetAtt NetworkStack.Outputs.SecurityGroupId
        AmiId: !Ref AmiId
        InstanceType: !Ref InstanceType
        RootVolumeSize: !Ref RootVolumeSize
        DataVolumeSize: !Ref DataVolumeSize
        ServerSecretArn: !Ref ServerSecretArn
        WorldSaveBucket: !Ref WorldSaveBucket
        WorldSaveKey: !Ref WorldSaveKey
        LogRetentionDays: !Ref LogRetentionDays
        BackupRetentionDays: !Ref BackupRetentionDays
        AlarmEmail: !Ref AlarmEmail
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  VpcId:
    Value: !GetAtt NetworkStack.Outputs.VpcId
  PublicSubnetId:
    Value: !GetAtt NetworkStack.Outputs.PublicSubnetId
  SecurityGroupId:
    Value: !GetAtt NetworkStack.Outputs.SecurityGroupId
  InstanceId:
    Value: !GetAtt WorkloadStack.Outputs.InstanceId
  PublicIp:
    Value: !GetAtt WorkloadStack.Outputs.PublicIp
  DataVolumeId:
    Value: !GetAtt WorkloadStack.Outputs.DataVolumeId
  LogGroupName:
    Value: !GetAtt WorkloadStack.Outputs.LogGroupName
  AlertsTopicArn:
    Value: !GetAtt WorkloadStack.Outputs.AlertsTopicArn
  BackupVaultName:
    Value: !GetAtt WorkloadStack.Outputs.BackupVaultName
  DashboardName:
    Value: !GetAtt WorkloadStack.Outputs.DashboardName
  VpcFlowLogGroupId:
    Value: !GetAtt NetworkStack.Outputs.VpcFlowLogGroupId
