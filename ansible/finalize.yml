---
- name: Baseline the completed hardened Dragonwilds image
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check if AIDE is installed
      ansible.builtin.stat:
        path: /usr/bin/aide
      register: aide_bin

    - name: Require AIDE from the hardened base
      ansible.builtin.assert:
        that: aide_bin.stat.exists
        fail_msg: "AIDE is missing; run a full master build before layering updates"

    - name: Configure AIDE exclusions for Dragonwilds runtime paths
      ansible.builtin.blockinfile:
        path: /etc/aide/aide.conf
        marker: "# {mark} ANSIBLE MANAGED DRAGONWILDS EXCLUSIONS"
        create: false
        block: |
          !/srv/dragonwilds
          !/var/lib/containers
          !/run/containers
          !/var/log/falco_alerts.json

    - name: Re-initialize AIDE database to baseline the final baked image
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -x /usr/sbin/update-aide.conf ]; then
          /usr/sbin/update-aide.conf
        fi
        aideinit -y -f
        test -s /var/lib/aide/aide.db
        chmod 0600 /var/lib/aide/aide.db
      args:
        executable: /bin/bash
      changed_when: true
