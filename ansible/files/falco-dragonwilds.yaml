---
# Keep Falco alerts machine-readable JSON and route to /var/log/falco_alerts.json
# for automated CloudWatch Agent collection.
json_output: true
# Retain informational events for Wazuh-like audit visibility. CloudWatch alarms
# remain limited to Warning and higher by their metric filter.
priority: informational

# Use the packaged rules_files order: defaults, then /etc/falco/rules.d.

stdout_output:
  enabled: false

syslog_output:
  enabled: false

file_output:
  enabled: true
  keep_alive: false
  filename: /var/log/falco_alerts.json

rules:
  - disable:
      rule: "*"

  # Enable Falco's vetted host and container baseline. Custom Dragonwilds
  # rules below supplement it with endpoint-style monitoring.
  - enable:
      tag: maturity_stable

  # Custom Dragonwilds security rules
  - enable:
      rule: Dragonwilds data directory modified
  - enable:
      rule: Sudo execution
  - enable:
      rule: Authentication attempt failed
  - enable:
      rule: Use of chattr
  - enable:
      rule: Use of Python
  - enable:
      rule: Protected system path modified
  - enable:
      rule: Account or group management tool executed
  - enable:
      rule: Package management tool executed
  - enable:
      rule: Kernel module changed
  - enable:
      rule: Firewall or routing tool executed
  - enable:
      rule: Privilege or namespace tool executed
  - enable:
      rule: Execution from writable temporary directory
  - enable:
      rule: Network reconnaissance tool executed
  - enable:
      rule: SSM interactive shell started
  - enable:
      rule: Sensitive credential file opened

  # Explicit names retain compatibility with packaged rulesets that predate
  # maturity tags on these high-value container detections.
  - enable:
      rule: Terminal shell in container
  - enable:
      rule: Clear Log Activities
  - enable:
      rule: Redirect STDOUT/STDIN to Network Connection in Container
  - enable:
      rule: Drop and execute new binary in container
