---
- name: Harden the Dragonwilds Ubuntu image
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - ../vars/cis.yml

  pre_tasks:
    # The pinned CIS role gathers package facts before installing auditd, then
    # uses those stale facts to decide whether to register a handler result.
    # Install it here so the handler always receives a result containing `rc`.
    - name: Prepare auditd before the CIS role gathers package facts
      when: not (audit_only | default(false) | bool)
      block:
        - name: Install auditd without optional mail-server packages
          ansible.builtin.apt:
            name:
              - auditd
              - audispd-plugins
            state: present
            update_cache: true
            install_recommends: false

  tasks:
    - name: Apply the Ubuntu CIS hardening role
      ansible.builtin.import_role:
        name: ubuntu24_cis
