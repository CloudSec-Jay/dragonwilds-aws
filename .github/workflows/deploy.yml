name: CI/CD Pipeline

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monthly re-bake on the 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Bake mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - fast
          - master
          - deploy-only

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linters & Ansible
        run: |
          pip install cfn-lint ansible-lint yamllint ansible boto3 PyYAML jq
          ansible-galaxy install -r ansible/requirements.yml

      - name: Set up Packer
        uses: hashicorp/setup-packer@main

      - name: Run ShellCheck
        run: |
          shellcheck ansible/files/dragonwilds-bootstrap.sh

      - name: Run deployment regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate Packer templates
        run: |
          packer fmt -check packer/
          packer init packer/dragonwilds-update.pkr.hcl
          packer validate -var "base_ami_id=ami-12345678" packer/dragonwilds-update.pkr.hcl
          packer init packer/dragonwilds.pkr.hcl
          packer validate packer/dragonwilds.pkr.hcl

      - name: Run yamllint
        run: |
          git ls-files -z 'ansible/*.yml' 'ansible/files/*.yaml' 'ansible/vars/*.yml' '.github/*.yml' | \
            xargs -0 yamllint -d "{extends: default, rules: {line-length: {max: 160}, document-start: disable}}"

      - name: Run cfn-lint
        run: |
          cfn-lint cloudformation/server.yaml

      - name: Run ansible-lint
        run: |
          ansible-lint ansible/image.yml ansible/finalize.yml

      - name: Run Trivy Security & IaC Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  detect-changes:
    name: Determine Build Type
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.check.outputs.build_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check file changes
        id: check
        env:
          REQUESTED_BUILD: ${{ inputs.build_type || 'auto' }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python scripts/detect_changes.py

  bake-and-deploy:
    name: Bake AMI & Deploy
    needs: [lint, detect-changes]
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.build_type != 'skip'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deployment dependencies
        run: pip install boto3 PyYAML

      - name: Resolve base AMI from the deployed stack
        if: ${{ needs.detect-changes.outputs.build_type == 'fast' }}
        id: base
        env:
          BASE_AMI_ID: ${{ secrets.BASE_AMI_ID }}
        run: |
          BASE_AMI=$(python scripts/deploy.py resolve-ami)
          echo "ami_id=$BASE_AMI" >> "$GITHUB_OUTPUT"

      - name: Install Ansible Dependencies
        if: ${{ needs.detect-changes.outputs.build_type == 'master' || needs.detect-changes.outputs.build_type == 'fast' }}
        run: |
          pip install ansible
          ansible-galaxy install -r ansible/requirements.yml

      - name: Set up Packer
        if: ${{ needs.detect-changes.outputs.build_type == 'master' || needs.detect-changes.outputs.build_type == 'fast' }}
        uses: hashicorp/setup-packer@main

      # Branch A: Full Master Build (~25m)
      - name: Bake Full Master AMI (CIS Hardened)
        if: ${{ needs.detect-changes.outputs.build_type == 'master' }}
        id: master-build
        run: |
          packer init packer/dragonwilds.pkr.hcl
          packer build \
            -var "aws_region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            packer/dragonwilds.pkr.hcl
          NEW_AMI=$(jq -r '.builds[-1].artifact_id' packer/manifest.json | cut -d':' -f2)
          echo "ami_id=$NEW_AMI" >> "$GITHUB_OUTPUT"

      # Branch B: Layered build, including the final AIDE baseline
      - name: Bake Fast Update AMI (Layered)
        if: ${{ needs.detect-changes.outputs.build_type == 'fast' }}
        id: fast-build
        run: |
          packer init packer/dragonwilds-update.pkr.hcl
          packer build \
            -var "base_ami_id=${{ steps.base.outputs.ami_id }}" \
            -var "aws_region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            packer/dragonwilds-update.pkr.hcl
          NEW_AMI=$(jq -r '.builds[-1].artifact_id' packer/manifest.json | cut -d':' -f2)
          echo "ami_id=$NEW_AMI" >> "$GITHUB_OUTPUT"

      - name: Deploy CloudFormation Stack
        env:
          BAKED_AMI_ID: ${{ steps.master-build.outputs.ami_id || steps.fast-build.outputs.ami_id }}
          BASE_AMI_ID: ${{ secrets.BASE_AMI_ID }}
          SERVER_SECRET_ARN: ${{ secrets.SERVER_SECRET_ARN }}
        run: python scripts/deploy.py deploy

      - name: Preserve recovery state for an interrupted deployment
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-recovery
          path: deployment-recovery.json
          if-no-files-found: ignore
          retention-days: 7
