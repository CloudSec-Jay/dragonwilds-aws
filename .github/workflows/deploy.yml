name: CI/CD Pipeline

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monthly re-bake on the 1st of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Bake mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - fast
          - master
          - deploy-only

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linters & Ansible
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy install -r ansible/requirements.yml

      - name: Set up Packer
        uses: hashicorp/setup-packer@main

      - name: Run pre-commit quality gates
        run: python -m pre_commit run --all-files --hook-stage pre-commit

      - name: Run Trivy Security & IaC Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  detect-changes:
    name: Determine Build Type
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.check.outputs.build_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check file changes
        id: check
        env:
          REQUESTED_BUILD: ${{ inputs.build_type || 'auto' }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          EVENT="${{ github.event_name }}"
          REQUESTED="${REQUESTED_BUILD}"
          BEFORE="${PUSH_BEFORE}"

          if [[ "$EVENT" == "schedule" || "$REQUESTED" == "master" ]]; then
            echo "build_type=master" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$REQUESTED" == "fast" || "$REQUESTED" == "deploy-only" ]]; then
            echo "build_type=${REQUESTED//-/_}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT" != "push" || -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "build_type=master" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(git diff --name-only "$BEFORE" HEAD -- 2>/dev/null || true)
          if echo "$FILES" | grep -qE '^(ansible/(playbooks/(bake|harden)\.yml|vars/cis\.yml|requirements\.yml)|packer/dragonwilds\.pkr\.hcl)$'; then
            echo "build_type=master" >> "$GITHUB_OUTPUT"
          elif echo "$FILES" | grep -qE '^(ansible/|packer/)'; then
            echo "build_type=fast" >> "$GITHUB_OUTPUT"
          elif echo "$FILES" | grep -qE '^cloudformation/'; then
            echo "build_type=deploy_only" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=skip" >> "$GITHUB_OUTPUT"
          fi

  bake-and-deploy:
    name: Bake AMI & Deploy
    needs: [lint, detect-changes]
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.build_type != 'skip'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Resolve base AMI from the deployed stack
        if: ${{ needs.detect-changes.outputs.build_type == 'fast' }}
        id: base
        env:
          BASE_AMI_ID: ${{ secrets.BASE_AMI_ID }}
        run: |
          BASE_AMI=$(aws cloudformation describe-stacks \
            --stack-name dragonwilds \
            --query "Stacks[0].Parameters[?ParameterKey=='AmiId'].ParameterValue" \
            --output text 2>/dev/null || echo "")
          if [[ -z "$BASE_AMI" || "$BASE_AMI" == "None" ]]; then
            BASE_AMI="$BASE_AMI_ID"
          fi
          echo "ami_id=$BASE_AMI" >> "$GITHUB_OUTPUT"

      - name: Install Ansible Dependencies
        if: ${{ needs.detect-changes.outputs.build_type == 'master' || needs.detect-changes.outputs.build_type == 'fast' }}
        run: |
          pip install ansible
          ansible-galaxy install -r ansible/requirements.yml

      - name: Set up Packer
        if: ${{ needs.detect-changes.outputs.build_type == 'master' || needs.detect-changes.outputs.build_type == 'fast' }}
        uses: hashicorp/setup-packer@main

      # Branch A: Full Master Build (~25m)
      - name: Bake Full Master AMI (CIS Hardened)
        if: ${{ needs.detect-changes.outputs.build_type == 'master' }}
        id: master-build
        run: |
          packer init packer/dragonwilds.pkr.hcl
          packer build \
            -var "aws_region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            packer/dragonwilds.pkr.hcl
          NEW_AMI=$(jq -r '.builds[-1].artifact_id' packer/manifest.json | cut -d':' -f2)
          echo "ami_id=$NEW_AMI" >> "$GITHUB_OUTPUT"

      # Branch B: Layered build (runtime and container updates)
      - name: Bake Fast Update AMI (Layered)
        if: ${{ needs.detect-changes.outputs.build_type == 'fast' }}
        id: fast-build
        run: |
          packer init packer/dragonwilds-update.pkr.hcl
          packer build \
            -var "base_ami_id=${{ steps.base.outputs.ami_id }}" \
            -var "aws_region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            packer/dragonwilds-update.pkr.hcl
          NEW_AMI=$(jq -r '.builds[-1].artifact_id' packer/manifest.json | cut -d':' -f2)
          echo "ami_id=$NEW_AMI" >> "$GITHUB_OUTPUT"

      - name: Deploy CloudFormation Stack
        env:
          BAKED_AMI_ID: ${{ steps.master-build.outputs.ami_id || steps.fast-build.outputs.ami_id }}
          BASE_AMI_ID: ${{ secrets.BASE_AMI_ID }}
          SERVER_SECRET_ARN: ${{ secrets.SERVER_SECRET_ARN }}
          WORLD_SAVE_BUCKET: ${{ secrets.WORLD_SAVE_BUCKET }}
          WORLD_SAVE_KEY: ${{ secrets.WORLD_SAVE_KEY }}
          CFN_ARTIFACT_BUCKET: ${{ secrets.CFN_ARTIFACT_BUCKET }}
          INSTANCE_TYPE: ${{ vars.INSTANCE_TYPE || 't3a.large' }}
        run: |
          TARGET_AMI="${BAKED_AMI_ID:-$BASE_AMI_ID}"
          if [[ -z "$TARGET_AMI" ]]; then
            TARGET_AMI=$(aws cloudformation describe-stacks \
              --stack-name dragonwilds \
              --query "Stacks[0].Parameters[?ParameterKey=='AmiId'].ParameterValue" \
              --output text)
          fi

          OVERRIDES=(
            "AmiId=${TARGET_AMI}"
            "ServerSecretArn=${SERVER_SECRET_ARN}"
            "InstanceType=${INSTANCE_TYPE}"
          )
          if [[ -n "${WORLD_SAVE_BUCKET}" && -n "${WORLD_SAVE_KEY}" ]]; then
            OVERRIDES+=("WorldSaveBucket=${WORLD_SAVE_BUCKET}" "WorldSaveKey=${WORLD_SAVE_KEY}")
          fi

          if [[ -z "$CFN_ARTIFACT_BUCKET" ]]; then
            echo "CFN_ARTIFACT_BUCKET is required to package nested CloudFormation templates" >&2
            exit 1
          fi

          aws cloudformation package \
            --template-file cloudformation/server.yaml \
            --s3-bucket "$CFN_ARTIFACT_BUCKET" \
            --s3-prefix dragonwilds/cloudformation \
            --output-template-file /tmp/dragonwilds-packaged.yaml

          aws cloudformation deploy \
            --stack-name dragonwilds \
            --template-file /tmp/dragonwilds-packaged.yaml \
            --parameter-overrides "${OVERRIDES[@]}" \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset
